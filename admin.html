<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard Admin — WFF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    .confirm-dialog{width:min(92vw,440px);padding:30px;background:linear-gradient(145deg,#201c42,#17152c);color:#fff;border:1px solid #4c4776;border-radius:20px;box-shadow:0 30px 90px #0c0a1ccc}
    .confirm-dialog::backdrop{background:#10101a99;backdrop-filter:blur(3px)}
    .confirm-dialog .eyebrow{color:#c4b5fd;margin:16px 0 7px}.confirm-dialog h2{font-size:25px}.delete-copy{color:#c8c7d8;line-height:1.55;margin-top:9px}.delete-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#59222e;color:#fda4af;font:700 29px/1 Inter}.confirm-dialog .dialog-actions{margin-top:27px}.confirm-dialog .button.ghost{background:#292549;border-color:#5b5581;color:#eeedff}.button.danger{background:#e24a5e}.button.danger:hover{background:#c9354b}
  </style>
</head>
<body>
  <main class="app" id="dashboard">
    <aside class="sidebar"><a class="brand" href="/">WFF <small>ADMIN</small></a><nav id="sidebarNav">
      <button data-page="events" class="active">Event</button><button data-page="keuskupan">Keuskupan</button><button data-page="paroki-stasi">Paroki &amp; Stasi</button>
      <span>OPERASIONAL</span><button data-page="registrations">Peserta</button><button data-page="donations">Donasi pribadi</button><button data-page="sponsors">Sponsor perusahaan</button><button data-page="products">Product Knowledge</button>
    </nav><a class="button ghost logout" href="/">Kembali ke situs</a></aside>
    <section class="content"><header><div><p class="eyebrow" id="pageGroup">MASTER DATA</p><h1 id="pageTitle">Event</h1></div><button class="button" id="addButton" type="button">+ Tambah</button></header><p class="notice" id="appMessage" role="status"></p><div class="table-card"><div class="table-scroll"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div><p class="empty" id="emptyState" hidden>Belum ada data.</p></div></section>
  </main>
  <dialog id="dataDialog"><form id="dataForm"><div class="dialog-title"><h2 id="dialogTitle">Tambah data</h2><button class="close" type="button" id="closeDialog" aria-label="Tutup">×</button></div><div class="field-grid" id="formFields"></div><div class="dialog-actions"><button class="button ghost" type="button" id="cancelDialog">Batal</button><button class="button" type="submit">Simpan</button></div></form></dialog>
  <dialog class="confirm-dialog" id="deleteDialog"><div class="delete-icon" aria-hidden="true">×</div><p class="eyebrow">KONFIRMASI HAPUS</p><h2>Hapus data ini?</h2><p class="delete-copy" id="deleteMessage">Data yang dihapus tidak dapat dikembalikan.</p><div class="dialog-actions"><button class="button ghost" type="button" id="cancelDelete">Batal</button><button class="button danger" type="button" id="confirmDelete">Hapus data</button></div></dialog>
  <script src="admin.js"></script>
</body></html>
