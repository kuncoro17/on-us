services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8002}:8001"
    environment:
      PORT: 8001
      DATABASE_URL: postgresql://wff:${POSTGRES_PASSWORD:-wff_local_password}@postgres:5432/wff
      REDIS_URL: redis://redis:6379
      CHURCH_BANK_NAME: ${CHURCH_BANK_NAME:-Rekening Gereja}
      CHURCH_BANK_ACCOUNT: ${CHURCH_BANK_ACCOUNT:-Belum diatur}
      CHURCH_ACCOUNT_HOLDER: ${CHURCH_ACCOUNT_HOLDER:-Panitia WFF}
      PAYMENT_INSTRUCTIONS: ${PAYMENT_INSTRUCTIONS:-Transfer sesuai nominal donasi, lalu unggah bukti transfer.}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wff
      POSTGRES_USER: wff
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wff_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wff -d wff"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  uploads_data:
